[package]
name = "shared"
version = "0.1.0"
edition = "2021"
resolver = "2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitfield-struct = "0.13.0"
crc32fast = { version = "1.5.3", default-features = false }
defmt = { version = ">=0.3", optional = true }
fnv = { version = "1.0.7", default-features = false }
log = "0.4.34"
postcard = { version = "1.1.3", default-features = false, features = ["experimental-derive"] }
serde = { version = "1.0.229", features = ["derive"], default-features = false }

[features]
defmt = ["dep:defmt"]
