[package]
edition = "2021"
name = "bootloader"
version = "0.1.0"
resolver = "2"

[dependencies]
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.2"
defmt-rtt = "1.3"
embassy-boot = { version = "0.7", default-features = false }
embassy-boot-nrf = { version = "0.12", default-features = false }
embassy-embedded-hal = { version = "0.6.0" }
embassy-futures = { version = "0.1.2" }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }
embassy-sync = { version = "0.8.0", features = [] }
embassy-executor = { version = "0.10.0", features = [
  "nightly",
  "platform-cortex-m",
  "executor-thread",
] }
embedded-hal = "1.0"
embedded-io = "0.7"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
panic-probe = { version = "1.0", features = ["print-defmt"], optional = true }


[features]
logging = ["embassy-boot/defmt", "embassy-boot-nrf/defmt"]

default = ["logging"]
