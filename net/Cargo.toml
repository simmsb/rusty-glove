[package]
name = "glove-net"
version = "0.1.0"
edition = "2021"
resolver = "2"
description = "The 802.15.4 network shared by the halves and the dongle"

[dependencies]
cortex-m = { version = "0.7.9" }
crc32fast = { version = "1.5.3", default-features = false }
defmt = { version = "1.2.0", optional = true }
embassy-boot = { version = "0.7", default-features = false }
embassy-embedded-hal = { version = "0.6.0" }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.1", features = [
  "tcp",
  "tcp-listener",
  "udp",
  "medium-ieee802154",
  "sixlowpan-fragmentation",
  "sixlowpan-reassembly",
] }
embassy-net-driver-channel = { version = "0.4.0" }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "unstable-pac"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1" }
embedded-io-async = { version = "0.7.0" }
embedded-storage-async = { version = "0.4.2" }
heapless = { version = "0.9.3" }
portable-atomic = { version = "1.15.0" }
postcard = { version = "1.1.3", default-features = false, features = ["experimental-derive"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
shared = { path = "../shared" }
# only here to pick the reassembly slot count, it must match embassy-net's
xarxa = { git = "https://github.com/embassy-rs/xarxa", rev = "8f6f33b131deb9ff3290e0e01079537e1ed7b2ad", default-features = false, features = [
  "reassembly-buffer-count-4",
] }

[features]
defmt = [
  "dep:defmt",
  "embassy-boot/defmt",
  "embassy-embedded-hal/defmt",
  "embassy-net/defmt",
  "embassy-net-driver-channel/defmt",
  "embassy-nrf/defmt",
  "shared/defmt",
]
